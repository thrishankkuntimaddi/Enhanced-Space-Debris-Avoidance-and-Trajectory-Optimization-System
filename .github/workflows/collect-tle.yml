# Daily TLE collection: accumulates the 7-day window of snapshots used by the pipeline.
name: Collect TLE snapshot
on:
  schedule: [{ cron: "15 3 * * *" }]
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m src.cli fetch
        env:
          SPACETRACK_USERNAME: ${{ secrets.SPACETRACK_USERNAME }}
          SPACETRACK_PASSWORD: ${{ secrets.SPACETRACK_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: tle-snapshot, path: inputs/snapshots/, retention-days: 8 }
