services:
  - type: web
    name: sdatos-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m src.cli build
    startCommand: gunicorn "src.interface.app:app"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
    autoDeploy: true
    plan: free
